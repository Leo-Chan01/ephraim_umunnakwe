# Builds the Next.js static export and deploys it to Firebase Hosting (phenomenalephraim).
#
# Because the site is a static export, link-preview tags (og:image etc.) for a
# blog post only exist after a rebuild. This runs:
#   - when Supabase fires a `blog-updated` repository_dispatch (see nextjs-portfolio/sql/blog_deploy_trigger.sql)
#   - on pushes to main that touch nextjs-portfolio/
#   - manually from the Actions tab
name: Deploy Next.js portfolio

on:
  repository_dispatch:
    types: [blog-updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nextjs-portfolio/**'
      - '.github/workflows/deploy-nextjs.yml'

# Rapid edits in the blog editor collapse into a single deploy of the latest data
concurrency:
  group: deploy-nextjs
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs-portfolio/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PHENOMENALEPHRAIM }}
          channelId: live
          projectId: phenomenalephraim
          entryPoint: nextjs-portfolio
